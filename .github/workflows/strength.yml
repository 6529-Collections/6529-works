name: Test strength

# How strong the tests are (docs/testing/README.md): per-contract coverage against its floors,
# and the Halmos proofs in test/symbolic. They run after every merge to main, nightly and on
# demand, not on pull requests, to keep the organisation's shared runners for the required
# checks.

on:
  push:
    branches: [main]
  schedule:
    # Every day at 04:30 UTC, after the nightly campaigns start.
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"

      - name: Install Foundry
        id: foundry_setup
        continue-on-error: true
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.7.1

      - name: Retry Foundry installation
        if: ${{ steps.foundry_setup.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          export FOUNDRY_DIR="$HOME/.foundry"
          foundryup="$FOUNDRY_DIR/bin/foundryup"
          test -x "$foundryup"
          for attempt in 1 2 3; do
            sleep "$((attempt * 15))"
            if "$foundryup" --install 1.7.1; then
              echo "$FOUNDRY_DIR/bin" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          exit 1

      - name: Coverage
        # Instrumented and unoptimized, under the lite profile (fewer fuzz and invariant cases;
        # docs/testing/README.md). Without the optimizer the gas-ceiling tests fail, as they
        # should: --allow-failure keeps the run going, and CI's Tests jobs run every test.
        env:
          FOUNDRY_PROFILE: lite
        run: forge coverage --report lcov --report summary --allow-failure

      - name: Coverage floors
        # Prints the per-contract table (also to the job summary) and the unreached lines and
        # branches; fails when a src/ contract drops below its floor in
        # tools/coverage-floors.json.
        run: python tools/check_coverage.py --uncovered

      - name: Upload the LCOV report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: ignore
          retention-days: 30

  symbolic-contracts:
    name: Symbolic (list the proof contracts)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      contracts: ${{ steps.list.outputs.contracts }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: List the test contracts
        id: list
        # Every *SymbolicTest contract in test/symbolic, one matrix job each below. Every
        # check_* in test/symbolic must sit inside one of them, so a proof in a contract the
        # name match misses fails here instead of being skipped.
        shell: bash
        run: |
          set -euo pipefail
          contracts=$(grep -ho '^contract [A-Za-z0-9_]*SymbolicTest\b' test/symbolic/*.sol | cut -d' ' -f2 | sort)
          test -n "$contracts"
          declared=$(grep -ho 'function check_[A-Za-z0-9_]*' test/symbolic/*.sol | wc -l)
          inside=$(awk 'FNR == 1 || /^(abstract contract|contract|library|interface) /{ok = ($0 ~ /^contract [A-Za-z0-9_]*SymbolicTest[^A-Za-z0-9_]/)} ok && /function check_/{n++} END {print n+0}' test/symbolic/*.sol)
          echo "$inside of $declared proofs are in a *SymbolicTest contract"
          test "$inside" -eq "$declared"
          json=$(echo "$contracts" | python3 -c 'import json, sys; print(json.dumps(sys.stdin.read().split()))')
          echo "contracts=$json" >> "$GITHUB_OUTPUT"

  symbolic:
    name: Symbolic (${{ matrix.contract }})
    needs: symbolic-contracts
    runs-on: ubuntu-latest
    # One test contract per job: a solver crash names its contract, the other contracts still
    # report, and a long stateful proof gets its own hour.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        contract: ${{ fromJSON(needs.symbolic-contracts.outputs.contracts) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"

      # Halmos compiles through Foundry (`forge build --ast`).
      - name: Install Foundry
        id: foundry_setup
        continue-on-error: true
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.7.1

      - name: Retry Foundry installation
        if: ${{ steps.foundry_setup.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          export FOUNDRY_DIR="$HOME/.foundry"
          foundryup="$FOUNDRY_DIR/bin/foundryup"
          test -x "$foundryup"
          for attempt in 1 2 3; do
            sleep "$((attempt * 15))"
            if "$foundryup" --install 1.7.1; then
              echo "$FOUNDRY_DIR/bin" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          exit 1

      - name: Install Halmos
        # Every package is pinned and hash-checked; wheels only, so nothing is built. The SMT
        # solver (yices-smt2) comes from the lock too, so Halmos downloads nothing.
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --only-binary=:all: --no-deps -r requirements-tools.lock

      - name: Halmos
        # Every check_* of this contract, with the options in halmos.toml; the job fails unless
        # each proof the contract declares ran and passed.
        env:
          FOUNDRY_PROFILE: symbolic
          CONTRACT: ${{ matrix.contract }}
        shell: bash
        run: |
          set -uo pipefail
          status=0
          log=$(mktemp)
          start=$SECONDS
          halmos --no-status --contract "$CONTRACT" 2>&1 | tee "$log" || status=1
          echo "$CONTRACT took $((SECONDS - start))s"
          declared=$(awk -v c="$CONTRACT" 'FNR == 1 || /^(abstract contract|contract|library|interface) /{ok = ($1 == "contract" && $2 == c)} ok && /function check_/{n++} END {print n+0}' test/symbolic/*.sol)
          passed=$(sed 's/\x1b\[[0-9;]*m//g' "$log" | grep -c '^\[PASS\] check_' || true)
          echo "$passed of $declared proofs passed"
          test "$declared" -gt 0 || status=1
          test "$passed" -eq "$declared" || status=1
          exit $status
