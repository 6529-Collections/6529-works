name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"

      - name: Link checker unit tests
        run: python -m tools.test_check_markdown_links

      - name: Markdown links
        # Every relative link and #anchor in tracked *.md files (lib/ excluded) must resolve.
        run: python tools/check_markdown_links.py

      - name: Role matrix generator unit tests
        run: python -m tools.test_gen_role_matrix

      - name: Role matrix
        # docs/audit/roles.md must be generated from config/genesis.core.example.json.
        run: python tools/gen_role_matrix.py --check

      - name: Docs facts checker unit tests
        run: python -m tools.test_check_docs_facts

      - name: Docs facts
        # Cited test names, interface IDs, event topic0 values and nSLOC figures match the code.
        run: python tools/check_docs_facts.py

      - name: Facts export generator unit tests
        run: python -m tools.test_gen_facts

      - name: Facts export
        # docs/facts.json, which the 6529.io site syncs, must be generated from the repository.
        run: python tools/gen_facts.py --check

      - name: Rule traceability checker unit tests
        run: python -m tools.test_check_rules

      - name: Rule traceability
        # Every rule row in docs/spec/ and every property and invariant in
        # docs/audit/invariants.md names a test that exists; a rule without one must be listed
        # in tools/rules-uncovered.txt, which can only shrink.
        run: python tools/check_rules.py --uncovered

      - name: Comment code checker unit tests
        run: python -m tools.test_check_comment_codes

      - name: Comment codes
        # Comments in src/ and script/ cite only spec rule, invariant and limitation IDs, ADRs,
        # EIPs and repository names, never internal reference codes.
        run: python tools/check_comment_codes.py src script

      - name: Sepolia manifest writer unit tests
        # script/sepolia/make_manifest.py builds the manifest's `safes` from the new genesis.
        run: python -m unittest discover -s script/sepolia -p "test_*.py"

  checks:
    name: Build and checks
    runs-on: ubuntu-latest
    # ADR 0001 budget: every CI job finishes in under 15 minutes.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # lib/openzeppelin-contracts and lib/forge-std only; their nested
          # submodules are test-only and not needed.
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"

      - name: Install Foundry
        id: foundry_setup
        continue-on-error: true
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.7.1

      - name: Retry Foundry installation
        if: ${{ steps.foundry_setup.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          export FOUNDRY_DIR="$HOME/.foundry"
          foundryup="$FOUNDRY_DIR/bin/foundryup"
          test -x "$foundryup"
          for attempt in 1 2 3; do
            sleep "$((attempt * 15))"
            if "$foundryup" --install 1.7.1; then
              echo "$FOUNDRY_DIR/bin" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          exit 1

      - name: Identify compiler inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          # Staged records bind paths, blob IDs, modes and the lib/ submodule commits.
          # test/Integrators.t.sol compiles examples/ and keeper/test/ with the test suite.
          digest=$(git ls-files --stage -z -- foundry.toml foundry.lock .gitmodules src test script lib examples keeper | sha256sum | cut -d ' ' -f1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Restore compiler output
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            out
            cache
            ~/.svm
          key: ${{ runner.os }}-${{ runner.arch }}-forge-1.7.1-solc-0.8.37-${{ steps.inputs.outputs.digest }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-forge-1.7.1-solc-0.8.37-

      - name: Format
        run: forge fmt --check

      - name: Format of examples and the keeper fixture
        # Plain `forge fmt --check` covers only the src, test and script folders.
        run: forge fmt --check examples keeper/test

      - name: Build
        run: forge build

      - name: Save compiler output
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            out
            cache
            ~/.svm
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Docs facts against the build
        # The audit scope's bytecode sizes, computed interface IDs and ABI event signatures.
        run: python tools/check_docs_facts.py --artifacts out

      - name: ABI and storage snapshots
        # Every src/ contract's ABI (selectors, topics, errors) and storage layout against
        # test/snapshots/; an agreed change is committed with `check_snapshots.py --update`.
        run: python tools/check_snapshots.py

      - name: Snapshot checker unit tests
        run: python -m tools.test_check_snapshots

      - name: Exported ABIs
        # abi/ (the integrator-facing export: one JSON ABI per deployable contract and public
        # interface, the forwarded surfaces merged, ERC-165 IDs) must match the build.
        run: python tools/export_abis.py --check

      - name: ABI exporter unit tests
        run: python -m tools.test_export_abis

      - name: Real-data vectors and event topics
        # test/fixtures/real/ must be what tools/make_vectors.py writes from the pinned Museum
        # records and the compiled ABIs of the permanent contracts.
        run: python tools/make_vectors.py --check

      - name: Vector generator unit tests
        run: python -m unittest tools.test_make_vectors

      - name: Budget gates
        # The measured profile is explicit: adding a Foundry profile must not silently
        # change which bytecode the EIP-170 gate measures.
        run: python tools/check_budgets.py --profile default

      - name: Budget checker unit tests
        run: python -m tools.test_check_budgets

      - name: Genesis configuration
        # config/genesis.core.example.json against forge's method IDs and every restricted
        # function.
        run: python tools/check_genesis.py

      - name: Genesis checker unit tests
        run: python -m tools.test_check_genesis

      - name: NatSpec
        # Every external or public function, getter, event and error in src/ is documented:
        # @notice (or @inheritdoc), a @param per parameter and a @return per return value.
        run: python tools/check_natspec.py

      - name: NatSpec checker unit tests
        run: python -m tools.test_check_natspec

      - name: Edition auction reference model
        # tools/edition_auction_ref.py (ADR 0005): the ladder, the clearing rule against brute
        # force, the FIFO sweep, and the committed golden vectors in test/fixtures/edition-auction/
        # (stale vectors fail; regenerate with `python tools/edition_auction_ref.py --write`).
        run: python -m tools.test_edition_auction_ref

      - name: Coverage and mutation tool unit tests
        # The tools run on main and on a schedule (strength.yml, mutation.yml); their unit
        # tests are cheap enough for every pull request.
        run: |
          python -m tools.test_check_coverage
          python -m tools.test_mutation

      - name: Content tooling tests
        # tools/content (standard library only). test_anvil.py sends the emitted calldata to the
        # compiled ContentStore on a local Anvil node, installed with Foundry above; with
        # CONTENT_E2E_REQUIRE a missing prerequisite fails the step instead of skipping the test.
        env:
          CONTENT_E2E_REQUIRE: "1"
        run: python -m unittest discover -s tools/content -t . -p "test_*.py"

      - name: Convention tooling tests
        # tools/conventions (standard library only): the schemas, examples, floor check, fact
        # sheet, control proof and custody check. The example signatures are recovered with
        # `cast`, installed with Foundry above; CONVENTIONS_CAST_REQUIRE fails instead of skipping.
        env:
          CONVENTIONS_CAST_REQUIRE: "1"
        run: python -m unittest discover -s tools/conventions -t . -p "test_*.py"

      - name: Reference keeper tests
        # keeper/ (standard library only): unit tests, then end-to-end runs on a local Anvil node
        # loaded from the Forge fixture keeper/test/KeeperFixture.t.sol; anvil, forge and cast
        # come with Foundry above. With KEEPER_E2E_REQUIRE a missing prerequisite fails the step
        # instead of skipping the test.
        env:
          KEEPER_E2E_REQUIRE: "1"
        run: python -m unittest keeper.test_keeper

  tests:
    name: Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    # ADR 0001 budget: every CI job finishes in under 15 minutes.
    timeout-minutes: 15
    # `forge test` in seven parallel parts that together run every test exactly once:
    # everything but the invariant tests, the economics invariants (the longest suite, in two
    # parts by test), the token, vault and signer invariants, the auction invariants, the
    # lifecycle invariants on the whole deployed stack, and the other invariants (the Medusa
    # harnesses' Forge runners among them). 68 invariant tests on 22 November 2026. Each part builds
    # incrementally from the cached compiler output. Recount when invariant suites are added:
    #   forge test --list --match-test "^invariant" --json
    # and check that each listed test matches exactly one filter below.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: unit, fuzz and integration
            filter: --no-match-test ^invariant
          - name: economics invariants, escrow and marks
            filter: --match-test ^invariant_(Dust|Escrow|Intermediaries|Marks|Observed) --match-contract ^EconomicsInvariant
          - name: economics invariants, releases
            filter: --match-test ^invariant_(Recipients|Released|Wallet) --match-contract ^EconomicsInvariant
          - name: core, vault and signer invariants
            filter: --match-test ^invariant --match-contract ^(StreamCore|IndependentStream|GovernedVault|CurationSigner)Invariant
          - name: auction invariants
            filter: --match-test ^invariant --match-contract ^(Auction|EditionAuction)
          - name: lifecycle invariants
            filter: --match-test ^invariant --match-contract ^(StreamLifecycle|StreamStates)Invariant
          - name: other invariants
            filter: --match-test ^invariant --no-match-contract ^((Economics|StreamCore|IndependentStream|GovernedVault|CurationSigner|StreamLifecycle|StreamStates)Invariant|Auction|EditionAuction)

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # lib/openzeppelin-contracts and lib/forge-std only; their nested
          # submodules are test-only and not needed.
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"

      - name: Install Foundry
        id: foundry_setup
        continue-on-error: true
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.7.1

      - name: Retry Foundry installation
        if: ${{ steps.foundry_setup.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          export FOUNDRY_DIR="$HOME/.foundry"
          foundryup="$FOUNDRY_DIR/bin/foundryup"
          test -x "$foundryup"
          for attempt in 1 2 3; do
            sleep "$((attempt * 15))"
            if "$foundryup" --install 1.7.1; then
              echo "$FOUNDRY_DIR/bin" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          exit 1

      - name: Identify compiler inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          # Staged records bind paths, blob IDs, modes and the lib/ submodule commits.
          # test/Integrators.t.sol compiles examples/ and keeper/test/ with the test suite.
          digest=$(git ls-files --stage -z -- foundry.toml foundry.lock .gitmodules src test script lib examples keeper | sha256sum | cut -d ' ' -f1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Restore compiler output
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            out
            cache
            ~/.svm
          key: ${{ runner.os }}-${{ runner.arch }}-forge-1.7.1-solc-0.8.37-${{ steps.inputs.outputs.digest }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-forge-1.7.1-solc-0.8.37-

      - name: Test
        env:
          FILTER: ${{ matrix.filter }}
        # FILTER is fixed in this file (word splitting is intended).
        run: |
          # shellcheck disable=SC2086
          forge test $FILTER

  walkthrough:
    name: Local walkthrough
    runs-on: ubuntu-latest
    # ADR 0001 budget: every CI job finishes in under 15 minutes.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # lib/openzeppelin-contracts and lib/forge-std only; their nested
          # submodules are test-only and not needed.
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"

      - name: Install Foundry
        id: foundry_setup
        continue-on-error: true
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.7.1

      - name: Retry Foundry installation
        if: ${{ steps.foundry_setup.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          export FOUNDRY_DIR="$HOME/.foundry"
          foundryup="$FOUNDRY_DIR/bin/foundryup"
          test -x "$foundryup"
          for attempt in 1 2 3; do
            sleep "$((attempt * 15))"
            if "$foundryup" --install 1.7.1; then
              echo "$FOUNDRY_DIR/bin" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          exit 1

      - name: Identify compiler inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          # Staged records bind paths, blob IDs, modes and the lib/ submodule commits.
          # test/Integrators.t.sol compiles examples/ and keeper/test/ with the test suite.
          digest=$(git ls-files --stage -z -- foundry.toml foundry.lock .gitmodules src test script lib examples keeper | sha256sum | cut -d ' ' -f1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Restore compiler output
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            out
            cache
            ~/.svm
          key: ${{ runner.os }}-${{ runner.arch }}-forge-1.7.1-solc-0.8.37-${{ steps.inputs.outputs.digest }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-forge-1.7.1-solc-0.8.37-

      - name: Build
        run: forge build

      - name: Walkthrough
        # script/local/walkthrough.sh: deploys on a fresh Anvil node with its test accounts,
        # accepts the network, runs VerifyCore, sells one work and an edition end to end, sells an
        # Independent Stream work and swaps a module; any failure fails it.
        run: bash script/local/walkthrough.sh

  contracts:
    # The required check: green only when the build, the checks, every test part and the
    # local walkthrough are.
    name: Contracts
    needs: [checks, tests, walkthrough]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Every part passed
        env:
          CHECKS: ${{ needs.checks.result }}
          TESTS: ${{ needs.tests.result }}
          WALKTHROUGH: ${{ needs.walkthrough.result }}
        run: |
          echo "Build and checks: $CHECKS; tests: $TESTS; local walkthrough: $WALKTHROUGH"
          test "$CHECKS" = success
          test "$TESTS" = success
          test "$WALKTHROUGH" = success

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    # Runs in parallel with Contracts and counts against the same 15-minute CI budget.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"

      # Slither compiles through Foundry (crytic-compile runs `forge build`).
      - name: Install Foundry
        id: foundry_setup
        continue-on-error: true
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.7.1

      - name: Retry Foundry installation
        if: ${{ steps.foundry_setup.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          export FOUNDRY_DIR="$HOME/.foundry"
          foundryup="$FOUNDRY_DIR/bin/foundryup"
          test -x "$foundryup"
          for attempt in 1 2 3; do
            sleep "$((attempt * 15))"
            if "$foundryup" --install 1.7.1; then
              echo "$FOUNDRY_DIR/bin" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          exit 1

      - name: Install Slither
        # Every package is pinned and hash-checked; wheels only, so nothing is built.
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --only-binary=:all: --no-deps -r requirements-tools.lock

      - name: Triage checker unit tests
        run: python -m tools.test_check_slither

      - name: Slither
        # Fails on any High or Medium finding without a row in docs/security/slither-triage.md.
        run: python tools/check_slither.py
