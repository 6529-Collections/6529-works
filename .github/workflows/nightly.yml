name: Nightly

# The long runs a pull request cannot afford (docs/testing/README.md): the invariant suites at
# the deep profile's depth, every fuzz test at 10,000 runs, the Medusa campaigns, and the fork
# tests against the real external dependencies (the Safe suites among them). Nightly and on
# demand; never on pull requests.

on:
  schedule:
    # Every day at 03:30 UTC.
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deep-invariants:
    name: Deep invariants (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Five parts that together run every invariant exactly once (tools/check_invariant_shards.py
    # checks it in CI). The filters are those of the Tests job of ci.yml, except that the
    # lifecycle campaigns run in the others part here. On 22 November 2026 the single
    # economics part took 2 h 05 and 2 h 32 and the single others part 2 h 50 and then over
    # the 3-hour limit; each is now two.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: economics, escrow and marks
            filter: --match-test ^invariant_(Dust|Escrow|Intermediaries|Marks|Observed) --match-contract ^EconomicsInvariant
          - name: economics, releases
            filter: --match-test ^invariant_(Recipients|Released|Wallet) --match-contract ^EconomicsInvariant
          # The token, vault and signer campaigns (StreamCore, IndependentStream, GovernedVault,
          # CurationSigner); not yet timed at the deep profile.
          - name: core, vault and signer
            filter: --match-test ^invariant --match-contract ^(StreamCore|IndependentStream|GovernedVault|CurationSigner)Invariant
          - name: auctions
            filter: --match-test ^invariant --match-contract ^(Auction|EditionAuction)
          - name: others
            filter: --match-test ^invariant --no-match-contract ^((Economics|StreamCore|IndependentStream|GovernedVault|CurationSigner)Invariant|Auction|EditionAuction)

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: true

      - name: Install Foundry
        id: foundry_setup
        continue-on-error: true
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.7.1

      - name: Retry Foundry installation
        if: ${{ steps.foundry_setup.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          export FOUNDRY_DIR="$HOME/.foundry"
          foundryup="$FOUNDRY_DIR/bin/foundryup"
          test -x "$foundryup"
          for attempt in 1 2 3; do
            sleep "$((attempt * 15))"
            if "$foundryup" --install 1.7.1; then
              echo "$FOUNDRY_DIR/bin" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          exit 1

      - name: Deep invariants
        # [profile.deep.invariant] in foundry.toml: many more runs, each deeper.
        env:
          FOUNDRY_PROFILE: deep
          FILTER: ${{ matrix.filter }}
        # FILTER is fixed in this file (word splitting is intended).
        run: |
          # shellcheck disable=SC2086
          forge test $FILTER

  deep-fuzz:
    name: Deep fuzz (10,000 runs)
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: true

      - name: Install Foundry
        id: foundry_setup
        continue-on-error: true
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.7.1

      - name: Retry Foundry installation
        if: ${{ steps.foundry_setup.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          export FOUNDRY_DIR="$HOME/.foundry"
          foundryup="$FOUNDRY_DIR/bin/foundryup"
          test -x "$foundryup"
          for attempt in 1 2 3; do
            sleep "$((attempt * 15))"
            if "$foundryup" --install 1.7.1; then
              echo "$FOUNDRY_DIR/bin" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          exit 1

      - name: Deep fuzz
        # [profile.deep.fuzz] in foundry.toml: every fuzz test at 10,000 runs (unit tests run
        # once, as on pull requests). The invariant suites have their own job above; the fork
        # suites skip without an RPC URL and have theirs below.
        env:
          FOUNDRY_PROFILE: deep
        run: forge test --no-match-test "^invariant" --no-match-path "test/fork/*"

  medusa-harnesses:
    name: Medusa (list the harnesses)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      harnesses: ${{ steps.list.outputs.harnesses }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: List the harnesses
        id: list
        # Every *Medusa contract in test/medusa (not the Forge runners, *.t.sol), one matrix job
        # each below. Without medusa.json or a harness the list is empty and the campaign job
        # is skipped, so this workflow passes before the harnesses exist.
        shell: bash
        run: |
          set -euo pipefail
          harnesses=""
          if [ -f medusa.json ] && [ -d test/medusa ]; then
            files=$(find test/medusa -name '*.sol' ! -name '*.t.sol' | sort)
            if [ -n "$files" ]; then
              # shellcheck disable=SC2086
              harnesses=$(grep -ho '^contract [A-Za-z0-9_]*Medusa\b' $files | cut -d' ' -f2 | sort -u || true)
            fi
          fi
          echo "Harnesses: ${harnesses:-none}"
          json=$(echo "$harnesses" | python3 -c 'import json, sys; print(json.dumps(sys.stdin.read().split()))')
          echo "harnesses=$json" >> "$GITHUB_OUTPUT"

  medusa:
    name: Medusa (${{ matrix.harness }})
    needs: medusa-harnesses
    if: ${{ needs.medusa-harnesses.outputs.harnesses != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        harness: ${{ fromJSON(needs.medusa-harnesses.outputs.harnesses) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"

      # Medusa compiles through crytic-compile, which runs `forge build`.
      - name: Install Foundry
        id: foundry_setup
        continue-on-error: true
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.7.1

      - name: Retry Foundry installation
        if: ${{ steps.foundry_setup.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          export FOUNDRY_DIR="$HOME/.foundry"
          foundryup="$FOUNDRY_DIR/bin/foundryup"
          test -x "$foundryup"
          for attempt in 1 2 3; do
            sleep "$((attempt * 15))"
            if "$foundryup" --install 1.7.1; then
              echo "$FOUNDRY_DIR/bin" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          exit 1

      - name: Install crytic-compile
        # From the hash-checked lock (crytic-compile is a Slither dependency); wheels only.
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --only-binary=:all: --no-deps -r requirements-tools.lock

      - name: Install Medusa
        # The release asset is checked against its build provenance attestation before use.
        env:
          GH_TOKEN: ${{ github.token }}
          MEDUSA_VERSION: v1.5.1
          MEDUSA_SHA256: ddfe1517ae9028ef9fc331b00f5a6a9d5406f3fcd11a715d60c6b6fb3e4546d3
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$MEDUSA_VERSION" --repo crytic/medusa --pattern medusa-linux-x64.tar.gz
          # The release carries a sigstore bundle, not a GitHub attestation. The digest below is
          # the one in that bundle, whose certificate was issued to crytic/medusa's release
          # workflow at this tag; a different file fails here.
          echo "$MEDUSA_SHA256  medusa-linux-x64.tar.gz" | sha256sum --check --strict
          tar -xzf medusa-linux-x64.tar.gz
          sudo install medusa /usr/local/bin/medusa
          medusa --version

      - name: Restore the corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: medusa-corpus/${{ matrix.harness }}
          key: medusa-corpus-${{ matrix.harness }}-${{ github.run_id }}
          restore-keys: medusa-corpus-${{ matrix.harness }}-

      - name: Fuzz for 30 minutes
        # medusa.json holds the settings (property_ prefix, no cheatcodes); this job compiles
        # only the harness's file (about 30 s, against 8 minutes for the whole project), into
        # its own build directories, narrows the targets to the harness and gives it its own
        # corpus.
        env:
          HARNESS: ${{ matrix.harness }}
          FOUNDRY_OUT: out-medusa
          FOUNDRY_CACHE_PATH: cache-medusa
        run: >-
          medusa fuzz --config medusa.json --timeout 1800
          --compilation-target "test/medusa/$HARNESS.sol"
          --target-contracts "$HARNESS" --corpus-dir "medusa-corpus/$HARNESS"

  deep-differential:
    name: Deep differential fuzz (edition auction settlement)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: true

      - name: Install Foundry
        id: foundry_setup
        continue-on-error: true
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.7.1

      - name: Retry Foundry installation
        if: ${{ steps.foundry_setup.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          export FOUNDRY_DIR="$HOME/.foundry"
          foundryup="$FOUNDRY_DIR/bin/foundryup"
          test -x "$foundryup"
          for attempt in 1 2 3; do
            sleep "$((attempt * 15))"
            if "$foundryup" --install 1.7.1; then
              echo "$FOUNDRY_DIR/bin" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          exit 1

      - name: Settlement scan against UniformClearing
        # The adapter's settlement scan (Yul) against the library the lens runs, 10,000 random
        # books (`forge-config: deep.fuzz.runs` on the test).
        # The filter is matched against the test's signature, so it ends at the opening
        # bracket, not at `$`; a filter that selects no test passes in Forge, so the step
        # also requires that the one test ran.
        env:
          FOUNDRY_PROFILE: deep
        shell: bash
        run: |
          set -euo pipefail
          forge test --match-test "^testFuzz_Settlement_EqualsTheLibraryClearing\(" | tee scan.log
          grep -q "1 tests passed, 0 failed, 0 skipped (1 total tests)" scan.log

  fork:
    name: Fork tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: true

      - name: Install Foundry
        id: foundry_setup
        continue-on-error: true
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.7.1

      - name: Retry Foundry installation
        if: ${{ steps.foundry_setup.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          export FOUNDRY_DIR="$HOME/.foundry"
          foundryup="$FOUNDRY_DIR/bin/foundryup"
          test -x "$foundryup"
          for attempt in 1 2 3; do
            sleep "$((attempt * 15))"
            if "$foundryup" --install 1.7.1; then
              echo "$FOUNDRY_DIR/bin" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          exit 1

      - name: Fork tests
        # test/fork skips itself unless these are set. Public endpoints, no credentials. The
        # match covers every suite in test/fork, the Safe suites (test/fork/Safe*) included.
        env:
          FORK_MAINNET_RPC: https://ethereum-rpc.publicnode.com
          FORK_SEPOLIA_RPC: https://ethereum-sepolia-rpc.publicnode.com
        run: forge test --match-path "test/fork/*" -vv

  report-failure:
    # A failed run of this workflow on main is otherwise visible only on the Actions page: no
    # pull request shows it. This job keeps one open issue for the workflow: it opens the issue
    # on the first failed run and comments on it on each later one; closing the issue is by
    # hand, once the cause is fixed. It runs only for runs of main in this repository, never
    # for a pull request or in a fork, and it is the only job here that may write anything:
    # issues, nothing else. It uses the `gh` on the runner with the run's own token.
    name: Report a failed run
    needs: [deep-invariants, deep-fuzz, medusa-harnesses, medusa, deep-differential, fork]
    if: >-
      ${{ failure() && github.event_name != 'pull_request'
      && github.event_name != 'pull_request_target' && github.ref == 'refs/heads/main'
      && github.repository == '6529-Collections/6529-works' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      - name: Open the issue, or comment on the open one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "Nightly workflow failed on main"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          body="The Nightly workflow failed on commit $SHA: $RUN_URL (attempt $ATTEMPT)."
          # The open issues this workflow's token opened, read from the issues API (not the
          # search index), with the title compared exactly. If they cannot be read, or the
          # comment fails, a new issue is opened: a second issue is better than no report.
          number=""
          if list=$(gh api --paginate \
            "repos/$GH_REPO/issues?state=open&creator=github-actions%5Bbot%5D&per_page=100" \
            --jq '.[] | select(.pull_request | not) | select(.title == env.TITLE) | .number'); then
            number=$(printf '%s\n' "$list" | head -n 1)
          else
            echo "::warning::Could not list the open issues; opening a new one."
          fi
          if [ -z "$number" ] || ! gh issue comment "$number" --body "$body"; then
            gh issue create --title "$TITLE" --body "$body"
          fi
