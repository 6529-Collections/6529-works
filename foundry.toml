# 6529 Works: Foundry configuration. Budgets: see ADR 0001 and tools/check_budgets.py.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["lib"]
auto_detect_remappings = false
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
solc_version = "0.8.37"
auto_detect_solc = false
# Prague is the newest fork whose semantics v1 needs (EIP-7702 in tests); it adds
# no opcodes over Cancun, so the bytecode runs unchanged on current mainnet.
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = false
# ADR 0001: CBOR metadata with an IPFS hash so Sourcify/Etherscan report exact matches.
bytecode_hash = "ipfs"
cbor_metadata = true
# Read-only access to the committed deployment configuration (config/) and test fixtures
# (test/fixtures/: the CC0 legal code the deploy stores), and read-write access to deployment
# records only (deployments/, written by script/Deploy.s.sol).
fs_permissions = [
    { access = "read", path = "./config" },
    { access = "read", path = "./test/fixtures" },
    { access = "read-write", path = "./deployments" },
]
# EIP-170/EIP-3860 stay enforced: code_size_limit is deliberately not raised.

[profile.default.fuzz]
runs = 256

# Lint production code on every build; tests build byte fixtures with deliberate casts.
[profile.default.lint]
ignore = ["test/**/*.sol"]

[profile.default.invariant]
runs = 256
depth = 128
fail_on_revert = true
show_metrics = true

# Nightly: every stateful invariant suite, longer and deeper than CI runs it:
#   FOUNDRY_PROFILE=deep forge test --match-test "invariant_"
# Only the campaign changes; the compiler settings are the default profile's.
[profile.deep.invariant]
runs = 2000
depth = 256
fail_on_revert = true
show_metrics = true

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

# Reduced-run test settings (FOUNDRY_PROFILE=lite) for the two tools that re-run the suite many
# times or slowly: `forge coverage` (instrumented and unoptimized) and the mutation campaign
# (once per mutant). Same sources and compiler settings as the default profile; only the fuzz
# and invariant case counts drop. It builds into its own directories, so the mutation tool's
# `forge clean` of the default build leaves it intact. See docs/testing/README.md.
[profile.lite]
out = "out-lite"
cache_path = "cache-lite"

[profile.lite.fuzz]
runs = 64

[profile.lite.invariant]
runs = 16
depth = 64

# Halmos symbolic tests (docs/testing/README.md): only test/symbolic is compiled, into separate
# output directories, so a Halmos run does not invalidate the default build.
[profile.symbolic]
test = "test/symbolic"
out = "out-symbolic"
cache_path = "cache-symbolic"
