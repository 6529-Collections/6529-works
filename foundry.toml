# 6529 Works: Foundry configuration. Budgets: see ADR 0001 and tools/check_budgets.py.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["lib"]
auto_detect_remappings = false
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
solc_version = "0.8.37"
auto_detect_solc = false
# Prague is the newest fork whose semantics v1 needs (EIP-7702 in tests); it adds
# no opcodes over Cancun, so the bytecode runs unchanged on current mainnet.
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = false
# ADR 0001: CBOR metadata with an IPFS hash so Sourcify/Etherscan report exact matches.
bytecode_hash = "ipfs"
cbor_metadata = true
# The storage layout goes into each artifact for tools/check_snapshots.py. It is an extra
# compiler output only: the bytecode and the metadata hash are unchanged.
extra_output = ["storageLayout"]
# Read-only access to the committed deployment configuration (config/) and test fixtures
# (test/fixtures/: the CC0 legal code the deploy stores), and read-write access to deployment
# records only (deployments/, written by script/Deploy.s.sol).
fs_permissions = [
    { access = "read", path = "./config" },
    { access = "read", path = "./test/fixtures" },
    { access = "read-write", path = "./deployments" },
]
# EIP-170/EIP-3860 stay enforced: code_size_limit is deliberately not raised.

[profile.default.fuzz]
runs = 256

# Lint production code on every build; tests build byte fixtures with deliberate casts.
[profile.default.lint]
ignore = ["test/**/*.sol"]
# Three lints are left out of the build output. Every hit in src/ and script/ was reviewed
# (39 on 21 November 2026) and src/ already marks 149 sites of the first and third inline;
# the hits left are on multi-line expressions an inline comment cannot reach. Each lint stays
# one command away for review: `forge lint --only-lint unsafe-typecast incorrect-shift
# block-timestamp` (`--only-lint` overrides this list). Slither, gated in CI, runs its own
# incorrect-shift and timestamp detectors (docs/security/slither-triage.md).
# - unsafe-typecast: unpacking a packed storage word (`uint208(w)`, `address(uint160(x))`,
#   `uint64(counts >> 64)`), a selector from revert data (`bytes4(reason)`), a word from return
#   data whose length is checked (`bytes32(answer)`), and casts bounded by a preceding check.
# - incorrect-shift: fires on a literal shifted by a variable, which here is always a bitmask
#   (`1 << index`, `(1 << n) - 1`), never a reversed shift.
# - block-timestamp: the protocol is timed by design (auctions, notices, delays of hours to
#   days), where a validator's few seconds of drift change nothing.
exclude_lints = ["unsafe-typecast", "incorrect-shift", "block-timestamp"]

[profile.default.invariant]
runs = 256
depth = 128
fail_on_revert = true
show_metrics = true

# Nightly (nightly.yml): every stateful invariant suite, longer and deeper than CI runs it,
# and every fuzz test at 10,000 runs:
#   FOUNDRY_PROFILE=deep forge test --match-test "^invariant"
#   FOUNDRY_PROFILE=deep forge test --no-match-test "^invariant" --no-match-path "test/fork/*"
# Only the campaigns change; the compiler settings are the default profile's.
[profile.deep.fuzz]
runs = 10000
# Two fuzz tests filter their inputs with `vm.assume` at about seven rejections per accepted
# run; at 10,000 runs they pass the default limit of 65,536 rejections.
max_test_rejects = 1000000

[profile.deep.invariant]
runs = 2000
depth = 256
fail_on_revert = true
show_metrics = true

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

# Reduced-run test settings (FOUNDRY_PROFILE=lite) for the two tools that re-run the suite many
# times or slowly: `forge coverage` (instrumented and unoptimized) and the mutation campaign
# (once per mutant). Same sources and compiler settings as the default profile; only the fuzz
# and invariant case counts drop. It builds into its own directories, so the mutation tool's
# `forge clean` of the default build leaves it intact. See docs/testing/README.md.
[profile.lite]
out = "out-lite"
cache_path = "cache-lite"

[profile.lite.fuzz]
runs = 64

[profile.lite.invariant]
runs = 16
depth = 64

# Halmos symbolic tests (docs/testing/README.md): only test/symbolic is compiled, into separate
# output directories, so a Halmos run does not invalidate the default build.
[profile.symbolic]
test = "test/symbolic"
out = "out-symbolic"
cache_path = "cache-symbolic"
